<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout web menggunakan frameset</title>
</head>

<frameset rows="100, *, 50" frameborder="1" border="1" framespacing="0">

    <!-- Header -->
    <frame src="header.html" name="headerframe">

    <!-- Sidebar & main content -->
    <frameset cols="25%, 75%">
        <frame src="sidebar.html" name="menuframe">
        <frame src="main.html" name="showframe">
    </frameset>

    <!-- Footer -->
    <frame src="footer.html">

</frameset>
</html>
